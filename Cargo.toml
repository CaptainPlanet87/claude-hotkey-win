[package]
name = "claude-hotkey"
version = "0.1.0"
edition = "2024"
description = "Globaler Hotkey-Picker für Claude (und andere KIs) auf Windows 11"
authors = ["Steve"]

[[bin]]
name = "claude-hotkey"
path = "src/main.rs"

[dependencies]
# Config
serde = { version = "1", features = ["derive"] }
serde_json = "1"
indexmap = { version = "2", features = ["serde"] }

# Globale Hotkeys (Win32 RegisterHotKey-Wrapper)
global-hotkey = "0.7"
keyboard-types = "0.7"

# Event-Loop für Hotkeys (Tao = winit-fork von Tauri)
tao = "0.30"

# UI für Pille + Halbkreis (iced normal, kein layershell)
iced = { version = "0.14", features = ["tokio", "canvas"] }

# Clipboard
arboard = "3"

# Desktop-Notifications (Win Toast)
notify-rust = "4"

# SendInput (Strg+C zum Grabben markierter Text)
winapi = { version = "0.3", features = ["winuser", "synchapi"] }

# Logging
log = "0.4"
env_logger = "0.11"

# Fehlerbehandlung
anyhow = "1"

# Util
dirs = "6"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
